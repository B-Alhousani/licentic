<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <title>Licentic - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
        }

        .full-container {
            position: relative;
            height: 100vh;
            width: 100%;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .full-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .logo-header {
            position: relative;
            z-index: 2;
            padding: 40px;
        }

        .logo-header img {
            width: 100px;
            height: auto;
            filter: brightness(0) invert(1);
        }

        .main-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
            padding: 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 72px;
            font-weight: 600;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .contact-button-container {
            margin-bottom: 40px;
        }

        .contact-button {
            display: inline-block;
            padding: 16px 50px;
            background: white;
            color: #2d2d2d;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 2px solid white;
            border-radius: 6px;
        }

        .contact-button:hover {
            background: transparent;
            color: white;
        }

        .description {
            max-width: 700px;
            margin: 0 auto;
            font-size: 16px;
            line-height: 1.8;
            font-weight: 300;
            opacity: 0.9;
        }

        .footer-info {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
            padding: 40px;
        }

        .company-name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .location {
            font-size: 15px;
            font-weight: 400;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 48px;
            }

            .logo-header img {
                width: 80px;
            }

            .description {
                font-size: 14px;
            }

            .contact-button {
                padding: 14px 40px;
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>
    <div class="full-container">
        <div class="logo-header">
            <img src="logo.png" alt="Licentic">
        </div>

        <div class="main-content">
            <h1>Coming Soon</h1>

            <div class="contact-button-container">
                <a href="mailto:contact@licentic.com" class="contact-button">Contact Us</a>
            </div>

            <p class="description">
                Software licensing shouldn't be a barrier, it should be a catalyst. Licentic delivers clarity,
                control, and confidence turning licensing complexity into competitive advantage.
            </p>
        </div>

        <div class="footer-info">
            <div class="company-name">Licentic</div>
            <div class="location">
                Masdar City, Abu Dhabi<br>
                United Arab Emirates
            </div>
        </div>
    </div>
</body>

</html>
